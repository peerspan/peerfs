[workspace]
resolver = "3"
members = [
    "crates/peerfs",
    "crates/peerfs-api",
    "crates/peerfs-core",
    "crates/peerfs-mount",
    "crates/peerfs-server",
    "crates/nfsserve",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
peerfs-api = { path = "crates/peerfs-api" }
peerfs-core = { path = "crates/peerfs-core" }
peerfs-mount = { path = "crates/peerfs-mount" }
peerfs-server = { path = "crates/peerfs-server" }
nfsserve = { path = "crates/nfsserve" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
diffy = "0.5"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast", "zeroize"] }
fastcdc = "5"
fuse-backend-rs = { version = "0.14", default-features = false, features = ["fusedev"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ignore = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
zstd = "0.14"

# From BeautifulRust's lints/lints.toml.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
