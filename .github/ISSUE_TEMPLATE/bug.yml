name: Bug report
description: Something peerfs does wrong
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead. Include logs if you have them.
    validations:
      required: true
  - type: input
    attributes:
      label: Platform
      description: OS and version, CPU architecture, the peerfs commit, and for a mount whether it is FUSE or NFS.
    validations:
      required: true
